site_name: КубГУ | Учебные работы
site_url: https://cherniy-valeriy.github.io/kubsu-university/
site_description: Учебное портфолио
site_author: Черный Валерий Робертович

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Светлая тема


markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md

  - 7 семестр:
      - Обзор: semester-7/index.md

      - Информационные технологии и системы безопасности:
          - О дисциплине: semester-7/information-security/index.md
          - Лабораторные работы: semester-7/information-security/labs/index.md

      - Теория систем и интеграция:
          - О дисциплине: semester-7/systems-theory/index.md
          - Лабораторные работы: semester-7/systems-theory/labs/index.md
          - Семинарские занятия: semester-7/systems-theory/seminars/index.md

      - Технологии ИИ и экспертные системы:
          - О дисциплине: semester-7/artificial-intelligence/index.md
          - Лабораторные работы: semester-7/artificial-intelligence/labs/index.md

      - Анализ больших данных:
          - О дисциплине: semester-7/big-data/index.md
          - Лабораторные работы: semester-7/big-data/labs/index.md

      - Администрирование информационных систем:
          - О дисциплине: semester-7/information-systems-admin/index.md
          - Лабораторные работы: semester-7/information-systems-admin/labs/index.md
          - Семинарские занятия: semester-7/information-systems-admin/seminars/index.md

      - Разработка серверных приложений:
          - О дисциплине: semester-7/server-development/index.md
          - Лабораторные работы: semester-7/server-development/labs/index.md
